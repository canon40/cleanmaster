name: 네이버 블로그 글 가져오기
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/fetch-blog.js', '.github/workflows/blog.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-blog.js
      - name: 변경이 있으면 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog.json blogimg
          git diff --cached --quiet || (git commit -m "블로그 글 목록 갱신" && git push)
