name: Fetch Naver Blog

on:
  schedule:
    # 매일 오전 9시·오후 6시 (KST ≈ UTC+9)
    - cron: "0 0,9 * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pull posts from Naver RSS
        run: npm run fetch-blog
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog.json blogimg
          if git diff --staged --quiet; then
            echo "No blog changes"
          else
            git commit -m "네이버 블로그 최신 글을 반영합니다."
            git push
          fi
